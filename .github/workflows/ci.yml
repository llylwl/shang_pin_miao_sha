name: CI

# ───────────────────────────────────────────────────────────────
# 触发条件：向 main 提 PR、或直接推送代码 / 手动触发
# 目标：单元测试 + 打包，产出可下载的构建产物
# ───────────────────────────────────────────────────────────────
on:
  push:
    branches: [ main, 'feature/**', 'fix/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 同一分支的新提交会取消上一次还在跑的构建，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MAVEN_OPTS: -Dfile.encoding=UTF-8

jobs:
  build:
    name: 构建与测试 (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven          # 自动缓存 ~/.m2，第二次构建明显变快

      - name: 编译
        run: mvn -B -ntp -DskipTests clean compile

      - name: 单元测试
        # DatabaseIntegrationTest 通过 @EnabledIfEnvironmentVariable(RUN_DB_TEST) 默认跳过，
        # CI 环境没有 MySQL，因此不需要额外配置也能绿
        run: mvn -B -ntp test

      - name: 打包（跳过测试，测试上一步已跑）
        run: mvn -B -ntp -DskipTests package

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: shang_pin_miao_sha-jar-${{ github.sha }}
          path: target/shang_pin_miao_sha.jar
          retention-days: 7

      - name: 上传测试报告
        if: always()          # 测试失败也要把报告留下，方便排查
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.sha }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: 构建结果摘要
        run: |
          echo "### 构建成功 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 提交: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 分支: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- 触发人: \`${{ github.actor }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Jar 大小: $(du -h target/shang_pin_miao_sha.jar | cut -f1)" >> $GITHUB_STEP_SUMMARY
