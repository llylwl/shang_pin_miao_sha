name: Release

# ───────────────────────────────────────────────────────────────
# CD：打 tag（如 v1.0.0）时自动构建并发布 jar 到 GitHub Release
# 练习顺序：CI 绿 → 合并到 main → git tag → git push --tags → 本流程自动跑
# ───────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: '手动发布版本号（如 1.0.0）'
        required: true
        default: '1.0.0'

permissions:
  contents: write          # 创建 Release 必须

jobs:
  release:
    name: 构建并发布 Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 取完整历史，用于生成 release notes

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 测试（发布前必须绿）
        run: mvn -B -ntp test

      - name: 打包
        run: mvn -B -ntp -DskipTests package

      - name: 重命名 jar 带上版本号
        id: jar
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then VERSION="${{ inputs.version }}"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          cp target/shang_pin_miao_sha.jar "shang_pin_miao_sha-${VERSION}.jar"
          ls -lh shang_pin_miao_sha-${VERSION}.jar

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 'v${{ steps.jar.outputs.version }}'
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: shang_pin_miao_sha-${{ steps.jar.outputs.version }}.jar
          body: |
            ## 构建信息
            - 提交: `${{ github.sha }}`
            - 构建时间: ${{ github.event.repository.updated_at }}
            - 运行: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ## 运行
            ```bash
            java -jar shang_pin_miao_sha-${{ steps.jar.outputs.version }}.jar
            ```
